# F1 Race Weekend Companion - Project Configuration
#
# This project uses uv for fast dependency management:
#   uv venv                      # Create virtual environment
#   uv pip install -e ".[dev]"   # Install with dev dependencies
#   uv pip install -e ".[infra]" # Install with infrastructure tools
#   uv pip install -e ".[dev,infra]"  # Install everything
#
# uv is 10-100x faster than pip: https://github.com/astral-sh/uv

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formula1-agentcore"
version = "0.1.0"
description = "F1 Race Weekend Companion using AWS Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vinny Carpenter"}
]

dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "boto3-stubs[bedrock-agent,bedrock-agent-runtime,dynamodb,lambda]>=1.34.0",
]

infra = [
    "aws-cdk-lib>=2.117.0",
    "constructs>=10.3.0",
]

[project.scripts]
f1-agent = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*", "infrastructure*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov=cli --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
